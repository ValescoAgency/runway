# VA-386 (dashboard slice 1): runs the always-on runway collector +
# dashboard locally. `docker compose up` brings up one service:
#
#   collector  — receives OTLP HTTP from `runway run`, projects spans
#                into SQLite, and serves the dashboard at /.
#
# Wire your shell up with:
#
#   export OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
#
# …then run `runway run`. Each drain appears on http://localhost:3001/.
# The data volume persists across container restarts, so history
# survives a `docker compose restart`.

services:
  collector:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: runway-collector
    restart: unless-stopped
    environment:
      OTLP_PORT: ${OTLP_PORT:-4318}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-3001}
      SQLITE_PATH: /data/runway.sqlite
      # VA-390: Linear sync is opt-in. When LINEAR_API_KEY is set the
      # dashboard polls Linear every LINEAR_POLL_INTERVAL_SECONDS
      # (default 300) to populate the "Todo queue (next up)" preview
      # and per-row status badges. Absent → those surfaces stay hidden
      # and the dashboard behaves exactly as in earlier slices.
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      LINEAR_POLL_INTERVAL_SECONDS: ${LINEAR_POLL_INTERVAL_SECONDS:-300}
      RUNWAY_LINEAR_TEAM: ${RUNWAY_LINEAR_TEAM:-VA}
      RUNWAY_READY_STATUS: ${RUNWAY_READY_STATUS:-Todo}
    ports:
      # VA-385: bind host-side to 127.0.0.1 only. The dashboard's
      # security commitment is loopback-only; without the explicit
      # `127.0.0.1:` prefix Docker publishes to 0.0.0.0 on the host
      # and the dashboard becomes reachable from the LAN. Container
      # side stays 0.0.0.0 (set by `DASHBOARD_HOST` in the Dockerfile)
      # so Docker's port-forward to the listener still works.
      #
      # OTLP HTTP endpoint — `runway run` posts /v1/traces here.
      - "127.0.0.1:${OTLP_PORT:-4318}:${OTLP_PORT:-4318}"
      # Dashboard UI — operator opens this in a browser.
      - "127.0.0.1:${DASHBOARD_PORT:-3001}:${DASHBOARD_PORT:-3001}"
    volumes:
      - runway-data:/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"fetch('http://127.0.0.1:'+process.env.DASHBOARD_PORT+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  runway-data:
