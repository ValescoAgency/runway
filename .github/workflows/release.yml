name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # `gh release create` writes the GitHub Release; needs contents: write.
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify version matches tag
        env:
          GITHUB_REF_TAG: ${{ github.ref }}
        run: |
          # jq is preinstalled on ubuntu-latest and works regardless of the
          # package's "type" (module vs commonjs).
          PKG_VERSION=$(jq -r .version package.json)
          TAG_VERSION="${GITHUB_REF_TAG#refs/tags/v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      # Hybrid auth: NODE_AUTH_TOKEN authenticates the PUT, --provenance
      # still attaches a sigstore-signed attestation via OIDC
      # (`id-token: write` permission). Provenance is independent of
      # the auth mechanism — it just needs the OIDC token, which the
      # runner always has.
      #
      # We use NODE_AUTH_TOKEN instead of npm Trusted Publishing
      # because of a still-unresolved policy-mismatch on the npm side:
      # OIDC publishes from this repo signed correctly but PUT 404'd
      # even with all claims matching the configured Trusted Publisher
      # entry. Revisit once npm support sorts it; once OIDC publishes
      # work, drop NODE_AUTH_TOKEN and delete the NPM_TOKEN secret.
      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Use the preinstalled `gh` CLI instead of softprops/action-gh-release —
      # avoids needing a third-party action in the repo's Actions allowlist
      # (Settings > Actions > General > Allow specified actions).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes-file CHANGELOG.md \
            --verify-tag
