name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # `gh release create` writes the GitHub Release; needs contents: write.
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify version matches tag
        env:
          GITHUB_REF_TAG: ${{ github.ref }}
        run: |
          # jq because the package has "type": "module"; `node -p require(...)`
          # would need an explicit --input-type=commonjs flag, and jq is
          # preinstalled on ubuntu-latest anyway.
          PKG_VERSION=$(jq -r .version package.json)
          TAG_VERSION="${GITHUB_REF_TAG#refs/tags/v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Use the preinstalled `gh` CLI instead of softprops/action-gh-release —
      # avoids needing a third-party action in the repo's Actions allowlist
      # (Settings > Actions > General > Allow specified actions).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes-file CHANGELOG.md \
            --verify-tag
