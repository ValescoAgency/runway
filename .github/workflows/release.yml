name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # `gh release create` writes the GitHub Release; needs contents: write.
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify version matches tag
        env:
          GITHUB_REF_TAG: ${{ github.ref }}
        run: |
          # jq is preinstalled on ubuntu-latest and works regardless of the
          # package's "type" (module vs commonjs).
          PKG_VERSION=$(jq -r .version package.json)
          TAG_VERSION="${GITHUB_REF_TAG#refs/tags/v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      # Authenticates via npm Trusted Publishing (OIDC) — no NPM_TOKEN
      # needed. Requires `permissions.id-token: write` (declared above)
      # and a Trusted Publisher entry on npmjs.com for the
      # @valescoagency/runway package pointing at this repo + workflow.
      # `--provenance` attaches a signed attestation to the published
      # tarball; visible on npmjs.com as "built and signed on a
      # cloud-hosted runner" and verifiable via
      # `npm audit signatures @valescoagency/runway`.
      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks --provenance

      # Use the preinstalled `gh` CLI instead of softprops/action-gh-release —
      # avoids needing a third-party action in the repo's Actions allowlist
      # (Settings > Actions > General > Allow specified actions).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes-file CHANGELOG.md \
            --verify-tag
