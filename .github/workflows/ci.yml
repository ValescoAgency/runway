name: CI

# Per VA-348: gate merges on typecheck + vitest. Release flow stays in
# release.yml; this workflow runs only on PRs and pushes to master.
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version is read from `packageManager` in package.json
        # (pnpm@11.1.1). Don't set `version:` here — it conflicts with
        # the package.json pin and pnpm/action-setup@v4 will refuse to
        # pick a winner.
        uses: pnpm/action-setup@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
